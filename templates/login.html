{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-8 bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
  <h1 class="text-2xl font-bold text-amber-400 mb-1">Welcome to {{ bank_name }}</h1>
  <p class="text-slate-400 text-sm mb-6">Log in with your account number and 4-digit PIN.</p>

  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-sm mb-1" for="account_number">Account Number</label>
      <input id="account_number" name="account_number" type="text" required autocomplete="username"
             class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-600 focus:border-amber-400 outline-none uppercase">
    </div>
    <div>
      <label class="block text-sm mb-1" for="pin">PIN</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" maxlength="4" pattern="\d{4}" required
             autocomplete="current-password"
             class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-600 focus:border-amber-400 outline-none tracking-widest">
    </div>
    <button type="submit" class="w-full bg-amber-400 text-slate-900 font-bold py-2 rounded hover:bg-amber-300">
      Log In
    </button>
  </form>
</div>
{% endblock %}
